name: Test

on:
  pull_request:
    paths-ignore:
      - 'site/**'
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The DuckDB driver is CGO (bundled libduckdb); ubuntu-latest ships gcc.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Verify the committed eBPF Go binding matches its C source. The bpf2go-generated
  # wrapper (netio_bpfel.go) is deterministic and encodes the C program's maps and
  # programs, so drift here means netio.c changed without regenerating. The compiled
  # object (netio_bpfel.o) is deliberately NOT diffed: clang's output is not
  # byte-reproducible across versions, so a byte-diff false-positives on any clang
  # mismatch. This still proves netio.c compiles cleanly and the binding is current.
  bpf-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      - name: Regenerate eBPF objects
        run: go generate ./internal/collector/

      - name: Fail if committed eBPF binding drifts from source
        run: |
          if ! git diff --exit-code -- internal/collector/netio_bpfel.go; then
            echo "::error::committed eBPF Go binding differs from 'go generate' output; run 'go generate ./internal/collector/' and commit the result"
            exit 1
          fi
