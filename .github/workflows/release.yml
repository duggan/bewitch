name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; only the job that creates the GitHub Release is
# granted write. The apt-repo / docs-snapshot jobs hold the GPG signing key and
# Cloudflare token, so they must not also be able to write to the repository.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build artifacts
        run: docker build -f Dockerfile.build -o dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: ( cd dist && sha256sum *.deb *.tar.gz > SHA256SUMS )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*.deb dist/*.tar.gz dist/SHA256SUMS
          --title "${{ github.ref_name }}"
          --generate-notes

  apt-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      - name: Install wrangler
        run: npm install -g wrangler@4.99.0

      - name: Upload artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/upload-pool.sh dist/*.deb dist/*.tar.gz

      - name: Write GPG key to file
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printenv GPG_PRIVATE_KEY > /tmp/signing.key

      # Publish a GPG-signed SHA256SUMS alongside the tarballs so the
      # `curl | sh` installer can verify integrity+authenticity (HTTPS alone
      # doesn't defend against an origin/CDN compromise). install.sh verifies
      # the signature with the same public key it already uses for APT.
      - name: Publish signed checksums to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ( cd dist && sha256sum *.deb *.tar.gz > SHA256SUMS )
          gpg --batch --import /tmp/signing.key
          gpg --batch --yes --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          scripts/upload-pool.sh dist/SHA256SUMS dist/SHA256SUMS.asc

      - name: Build APT repo image
        run: docker build -f Dockerfile.repo -t bewitch-repo .

      - name: Generate signed APT repo metadata
        run: |
          docker run --rm \
            -e SITE_PUBLIC=/work/site/public \
            -e GPG_KEY_FILE=/work/signing.key \
            -v "${{ github.workspace }}/dist:/work/dist" \
            -v "${{ github.workspace }}/site/public:/work/site/public" \
            -v /tmp/signing.key:/work/signing.key:ro \
            bewitch-repo dist/*.deb

      - name: Clean up GPG key
        if: always()
        run: rm -f /tmp/signing.key

      - name: Upload APT metadata to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/upload-dists.sh site/public

      - name: Purge APT metadata cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "files": [
                "https://bewitch.dev/apt/dists/stable/Release",
                "https://bewitch.dev/apt/dists/stable/Release.gpg",
                "https://bewitch.dev/apt/dists/stable/InRelease",
                "https://bewitch.dev/apt/dists/stable/main/binary-amd64/Packages",
                "https://bewitch.dev/apt/dists/stable/main/binary-amd64/Packages.gz",
                "https://bewitch.dev/apt/dists/stable/main/binary-arm64/Packages",
                "https://bewitch.dev/apt/dists/stable/main/binary-arm64/Packages.gz"
              ]
            }'

  # Snapshot the docs for this release into R2 so they're served, frozen, at
  # /docs/<tag>/** (functions/docs/[[path]].js). The default /docs/ keeps
  # tracking main; this preserves each release's docs at a stable URL.
  docs-snapshot:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: 0.22.1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          sudo mv zola /usr/local/bin/

      - name: Stamp docs version from VERSION
        # Match deploy-site.yml: pin version-specific download URLs in the
        # installation docs before building.
        run: |
          V=$(cat VERSION)
          sed -i \
            -e "s|bewitch-[0-9][0-9.]*-linux|bewitch-${V}-linux|g" \
            -e "s|bewitch_[0-9][0-9.]*-1_|bewitch_${V}-1_|g" \
            site/content/docs/installation.md

      - name: Generate docs version data
        run: scripts/gen-site-versions.sh

      - name: Build site
        working-directory: site
        run: zola build

      - name: Install wrangler
        run: npm install -g wrangler@4.99.0

      - name: Upload docs snapshot to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/upload-docs.sh site/dist/docs "${{ github.ref_name }}"
