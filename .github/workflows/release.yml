name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build artifacts
        run: docker build -f Dockerfile.build -o dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*.deb dist/*.tar.gz
          --title "${{ github.ref_name }}"
          --generate-notes

  apt-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Upload artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/upload-pool.sh dist/*.deb dist/*.tar.gz

      - name: Write GPG key to file
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printenv GPG_PRIVATE_KEY > /tmp/signing.key

      - name: Build APT repo image
        run: docker build -f Dockerfile.repo -t bewitch-repo .

      - name: Generate signed APT repo metadata
        run: |
          docker run --rm \
            -e SITE_PUBLIC=/work/site/public \
            -e GPG_KEY_FILE=/work/signing.key \
            -v "${{ github.workspace }}/dist:/work/dist" \
            -v "${{ github.workspace }}/site/public:/work/site/public" \
            -v /tmp/signing.key:/work/signing.key:ro \
            bewitch-repo dist/*.deb

      - name: Clean up GPG key
        if: always()
        run: rm -f /tmp/signing.key

      - name: Upload APT metadata to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/upload-dists.sh site/public

      - name: Purge APT metadata cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "files": [
                "https://bewitch.dev/apt/dists/stable/Release",
                "https://bewitch.dev/apt/dists/stable/Release.gpg",
                "https://bewitch.dev/apt/dists/stable/InRelease",
                "https://bewitch.dev/apt/dists/stable/main/binary-amd64/Packages",
                "https://bewitch.dev/apt/dists/stable/main/binary-amd64/Packages.gz",
                "https://bewitch.dev/apt/dists/stable/main/binary-arm64/Packages",
                "https://bewitch.dev/apt/dists/stable/main/binary-arm64/Packages.gz"
              ]
            }'

  # Snapshot the docs for this release into R2 so they're served, frozen, at
  # /docs/<tag>/** (functions/docs/[[path]].js). The default /docs/ keeps
  # tracking main; this preserves each release's docs at a stable URL.
  docs-snapshot:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: 0.22.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          sudo mv zola /usr/local/bin/

      - name: Stamp docs version from VERSION
        # Match deploy-site.yml: pin version-specific download URLs in the
        # installation docs before building.
        run: |
          V=$(cat VERSION)
          sed -i \
            -e "s|bewitch-[0-9][0-9.]*-linux|bewitch-${V}-linux|g" \
            -e "s|bewitch_[0-9][0-9.]*-1_|bewitch_${V}-1_|g" \
            site/content/docs/installation.md

      - name: Generate docs version data
        run: scripts/gen-site-versions.sh

      - name: Build site
        working-directory: site
        run: zola build

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Upload docs snapshot to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/upload-docs.sh site/dist/docs "${{ github.ref_name }}"
