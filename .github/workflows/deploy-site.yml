name: Deploy Site

on:
  push:
    branches: [main]
    paths: [site/**, VERSION, .github/workflows/deploy-site.yml]
  pull_request:
    paths: [site/**]
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOLA_VERSION: 0.22.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          sudo mv zola /usr/local/bin/
          zola --version

      - name: Stamp docs version from VERSION
        # The installation docs pin version-specific download URLs. Zola can't
        # interpolate inside code blocks, so substitute the current VERSION into
        # the source before building (mirrors the old Vite __BEWITCH_VERSION__).
        run: |
          V=$(cat VERSION)
          sed -i \
            -e "s|bewitch-[0-9][0-9.]*-linux|bewitch-${V}-linux|g" \
            -e "s|bewitch_[0-9][0-9.]*-1_|bewitch_${V}-1_|g" \
            site/content/docs/installation.md

      - name: Generate docs version data
        # Drives the docs version switcher/banner from VERSION + LATEST_STABLE.
        run: scripts/gen-site-versions.sh

      - name: Build
        working-directory: site
        # Production (push to main) builds with the absolute base_url for correct
        # sitemap / canonical / OG tags. PR previews build root-relative so CSS,
        # JS, images and links resolve on the *.pages.dev preview origin instead
        # of pointing back at production bewitch.dev.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            zola build --base-url "/"
          else
            zola build
          fi

      - name: Stamp install scripts with VERSION
        run: |
          VERSION=$(cat VERSION)
          # Zola copies static/install.sh verbatim; stamp the deployed copies.
          sed "s/^VERSION=\"[^\"]*\"/VERSION=\"${VERSION}\"/" \
              site/static/install.sh > site/dist/install.sh
          sed -e "s/^VERSION=\"[^\"]*\"/VERSION=\"${VERSION}\"/" \
              -e 's/BEWITCH_CHANNEL:-stable/BEWITCH_CHANNEL:-dev/' \
              site/static/install.sh > site/dist/install-dev.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=bewitch --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
