# NOTE: this file holds secrets (auth_token, SMTP password, shoutrrr URLs,
# custom-source auth). Keep it non-world-readable — the Debian package and
# install.sh install it as root:bewitch mode 0640. If you create it by hand, run:
#   sudo chown root:bewitch /etc/bewitch.toml && sudo chmod 640 /etc/bewitch.toml

[daemon]
# mock = false  # synthetic data for macOS TUI development
# socket = "/run/bewitch/bewitch.sock"  # default; requires RuntimeDirectory=bewitch in systemd
# listen = ":9119"  # optional TCP listener for remote TUI access; empty = disabled
# tls_cert = "/etc/bewitch/tls/cert.pem"  # PEM certificate; empty = auto-generate self-signed
# tls_key = "/etc/bewitch/tls/key.pem"    # PEM private key; empty = auto-generate self-signed
# tls_disabled = false                     # set true to disable TLS on TCP listener
# auth_token = ""                          # bearer token for TCP client authentication; empty = no auth
db_path = "/var/lib/bewitch/bewitch.duckdb"
# export_dir = "/var/lib/bewitch"  # confines /api/export and /api/snapshot output to this
#                                  # directory; default = the db_path directory. Output cannot
#                                  # be written outside it, traverse symlinks, or overwrite.
# log_level = "info"  # log level: debug, info, warn, error; default "info"
# default_interval = "5s"  # default collection interval for all collectors; minimum 100ms
# retention = "30d"  # delete metrics older than this; empty = keep forever
# prune_interval = "1h"  # how often to delete old data (requires retention); default "1h"
# compaction_interval = "7d"  # full DB rebuild interval; empty = disabled
# checkpoint_threshold = "16MB"  # DuckDB WAL auto-checkpoint size; default "16MB"
# db_memory_limit = "512MB"  # cap DuckDB working memory; default "512MB". Large queries,
                             # exports, and archives spill to disk (duckdb_tmp next to db_path)
                             # instead of OOM-killing the daemon. Raise on big hosts with spare RAM.
# checkpoint_interval = "5m"  # forced checkpoint interval for crash safety; empty = disabled
# archive_threshold = "7d"  # archive data older than this to Parquet; empty = disabled
# archive_interval = "6h"  # how often to run archive; default "6h"
# archive_path = "/var/lib/bewitch/archive"  # default: sibling "archive" dir next to db_path

[alerts]
evaluation_interval = "10s"
# Alert rules are now managed via the TUI (Alerts tab → press 'n' to create)

# Local mail command (postfix/sendmail):
# [[alerts.email]]
# use_mail_cmd = true
# to = ["admin@example.com"]
# from = "bewitch@myserver.local"  # optional, uses system default if omitted

# Full SMTP:
# [[alerts.email]]
# smtp_host = "smtp.example.com"
# smtp_port = 587                 # default 587; use 465 for implicit TLS
# username = "alerts@example.com"
# password = "app-password"
# from = "alerts@example.com"
# to = ["admin@example.com", "ops@example.com"]
# starttls = true                 # default true; set false for implicit TLS (port 465)

# [[alerts.commands]]
# cmd = "/usr/local/bin/alert-handler"  # receives BEWITCH_RULE, BEWITCH_SEVERITY, BEWITCH_MESSAGE, BEWITCH_STATUS (firing|resolved), BEWITCH_TIMESTAMP env vars

# Notification fan-out via Shoutrrr URLs — Discord, Telegram, ntfy, Slack, Pushover,
# Gotify, generic webhook, and more, each from a single URL. Firing alerts, recovery
# all-clears, and the collection-stalled dead-man's-switch all go to every URL.
# See https://containrrr.dev/shoutrrr/services for the URL format of each service.
# shoutrrr_urls = [
#   "discord://token@channel-id",
#   "ntfy://ntfy.sh/my-homelab-topic",
#   "telegram://token@telegram?chats=12345",
# ]

[tui]
refresh_interval = "2s"
# history_ranges = ["1h", "6h", "24h", "7d", "30d"]  # time range presets for history charts

# [tui.capture]
# directory = "~/screenshots"    # default save directory; empty = home directory
# dpi = 144                      # render DPI; 72 = 1x, 144 = 2x (default), 216 = 3x
# compression = "best"           # PNG compression: "default", "best", "none"
# background = "#1A1A2E"         # canvas background color
# foreground = "#F8F8F2"         # default text color

[collectors.cpu]
# interval = "1s"  # override default_interval for CPU collection

[collectors.memory]
# interval = "5s"

[collectors.load]
# interval = "5s"  # system load average (1/5/15 min) from /proc/loadavg

[collectors.disk]
# interval = "30s"
# smart_interval = "5m"  # how often to read SMART data from disks (requires CAP_SYS_RAWIO)
# Mount paths to exclude (prefix match). Default excludes: /snap/, /run/
# exclude_mounts = ["/boot/efi"]  # add to defaults
# no_default_excludes = false  # set true to disable defaults

[collectors.network]
# interval = "5s"

[collectors.ecc]
# interval = "60s"

[collectors.temperature]
# interval = "5s"
# enabled = true  # set to false to disable temperature collection

[collectors.power]
# interval = "5s"
# enabled = true  # set to false to disable power collection

[collectors.gpu]
# interval = "5s"
# enabled = true  # set to false to disable GPU collection (Intel iGPU via intel_gpu_top, NVIDIA via nvidia-smi)

[collectors.process]
# interval = "5s"
# max_processes = 100  # maximum number of processes to track per collection cycle
# pinned = ["nginx*", "postgres", "redis-server"]  # glob patterns of process names to always track with full metrics
# network_io = true  # per-process network I/O via eBPF (TCP rx/tx); set false to skip loading
#                    # the BPF programs entirely if the per-syscall/per-cycle overhead is unwanted.
#                    # Requires CAP_BPF + CAP_PERFMON, BTF, and kernel >= 5.5; disk I/O is unaffected.

# ---------------------------------------------------------------------------
# Custom data sources
# ---------------------------------------------------------------------------
# Poll a local service's HTTP API and surface chosen fields as bewitch metrics
# (charted + Prometheus-exported + alertable) and live status. No Go required.
#
# Define sources inline here as [[custom_source]] blocks, and/or drop one TOML
# file per service into the sources.d/ directory (next to this config, or set
# [daemon] sources_dir). Both are merged; a drop-in overrides an inline source
# of the same name. Each source becomes a sub-section of the TUI "Services" tab.
#
# Auth and secrets stay on the daemon host and are never logged or returned by
# the API. Targets are operator-trusted (same trust level as [[alerts.commands]]);
# redirects are disabled and response bodies are capped at 1 MiB.

# [[custom_source]]
# name      = "pihole"               # unique; [a-z0-9_-]; the `source` label/column
# enabled   = true
# interval  = "10s"
# timeout   = "4s"                    # capped below interval; a hung poll can't stall the tick
# base_url  = "http://pi.hole"
#
#   [custom_source.request]
#   method  = "GET"
#   path    = "/admin/api.php"
#   # headers = { Accept = "application/json" }
#
#   [custom_source.auth]
#   type = "none"                     # none | bearer | basic | header
#   # token = "..."                   # bearer (e.g. a Home Assistant long-lived token)
#   # username = "..."                # basic
#   # password = "..."
#   # header_name  = "X-Api-Key"      # header (e.g. an API key or session cookie)
#   # header_value = "..."
#
#   # Numeric fields -> stored time-series (charted, Prometheus, alertable).
#   # path is a gjson path into the JSON response (dot notation, array index,
#   # filters: see https://github.com/tidwall/gjson). unit is a display hint:
#   # bytes | bits | percent | count | duration | raw
#   [[custom_source.metric]]
#   name = "queries"
#   path = "dns_queries_today"
#   unit = "count"
#   [[custom_source.metric]]
#   name = "blocked"
#   path = "ads_blocked_today"
#   unit = "count"
#
#   # Non-numeric fields -> live status strip only (never stored).
#   [[custom_source.status]]
#   label = "Blocking"
#   path  = "status"
#   # badges map an exact value to a style: ok | warn | crit
#   [custom_source.status.badges]
#   enabled  = "ok"
#   disabled = "crit"

# Docker over its unix socket (no TCP host needed):
# [[custom_source]]
# name        = "docker"
# interval    = "15s"
# unix_socket = "/var/run/docker.sock"
# base_url    = "http://unix"          # placeholder host; the socket is dialed instead
#   [custom_source.request]
#   path = "/info"
#   [[custom_source.metric]]
#   name = "containers_running"
#   path = "ContainersRunning"
#   unit = "count"
#   [[custom_source.metric]]
#   name = "images"
#   path = "Images"
#   unit = "count"
#   [[custom_source.status]]
#   label = "Server"
#   path  = "ServerVersion"
